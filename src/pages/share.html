<!doctype html>
<html lang="@@LOCALE@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{{title}}</title>
<style>
  :root { color-scheme: light dark;
    --bg: #F3F5F8; --card: #FFFFFF; --fg: #16181D; --muted: #5B6572; --line: #E3E7EC; --line-soft: #EEF1F4;
    --accent: #2F5BEA; --accent-ink: #1E3FBF; --accent-bg: #EEF3FF; --accent-tint: #DCE6FF; --accent-line: #C9D6FF; --accent-soft: #F5F8FF;
    --ok: #1F8A4C; --ok-ink: #1F6B45; --ok-bg: #E6F4EC; --chip: #F7F8FA; --avatar: #EEF1F4; --avatar-ink: #3D4752; --danger: #B91C1C; }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #0F1419; --card: #171D26; --fg: #E5E7EB; --muted: #9CA3AF; --line: #2A3340; --line-soft: #222B36;
    --accent: #6D8CFF; --accent-ink: #A9BBFF; --accent-bg: #1B2440; --accent-tint: #223060; --accent-line: #35477E; --accent-soft: #161D30;
    --ok: #34D399; --ok-ink: #7EE2B8; --ok-bg: #0F2A22; --chip: #1F2733; --avatar: #273040; --avatar-ink: #C3CAD3; --danger: #F87171; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); -webkit-text-size-adjust: 100%;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "PingFang SC", "Noto Sans SC", sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  button { font: inherit; cursor: pointer; color: var(--fg); -webkit-tap-highlight-color: transparent; }
  svg { display: block; }

  header { background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1200px; margin: 0 auto; padding: 0 24px; min-height: 64px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .brand .mark { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
  .addr { display: flex; align-items: center; min-width: 0; border: 1px solid var(--line); border-radius: 999px; background: var(--chip); padding: 4px 4px 4px 14px; gap: 10px; }
  .addr .mono { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pill { height: 28px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--card); box-shadow: 0 0 0 1px var(--line); font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: 0 0 auto; }
  .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ok-ink); background: var(--ok-bg); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--ok); }
  .icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover, .pill:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  main { max-width: 1200px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 20px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .list-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
  .list-head b { font-size: 13px; font-weight: 600; }
  .list-head span { font-size: 12px; color: var(--muted); }
  .items { list-style: none; margin: 0; padding: 0; max-height: calc(100vh - 220px); overflow: auto; }
  .items li { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); cursor: pointer; }
  .items li:last-child { border-bottom: 0; }
  .items li:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
  .items li.active { background: var(--accent-bg); }
  .avatar { flex: 0 0 36px; width: 36px; height: 36px; border-radius: 999px; background: var(--avatar); color: var(--avatar-ink); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .avatar.code { background: var(--accent-tint); color: var(--accent-ink); }
  .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .from { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .time { flex: 0 0 auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .subject { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snippet { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .coderow { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .chip-code { flex: 0 0 auto; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; background: var(--card); border: 1px solid var(--accent-line); border-radius: 6px; padding: 1px 8px; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }

  .detail { display: flex; flex-direction: column; min-height: 60vh; }
  .detail-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 12px; }
  .back { display: none; align-items: center; gap: 6px; align-self: flex-start; border: 0; background: transparent; padding: 0; font-size: 13px; color: var(--muted); }
  .detail-head h2 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .meta .who { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); }
  .meta .avatar { flex-basis: 24px; width: 24px; height: 24px; font-size: 11px; }
  .meta .dot { color: var(--line); }
  .placeholder { padding: 40px 24px; color: var(--muted); }
  .codebox { margin: 20px 24px 0; padding: 16px 18px; border: 1px solid var(--accent-line); background: var(--accent-soft); border-radius: 12px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .codebox .col { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 4px; }
  .codebox .label { font-size: 12px; font-weight: 600; color: var(--accent-ink); letter-spacing: 0.04em; }
  .codebox .code { font-size: 32px; font-weight: 600; letter-spacing: 0.18em; line-height: 1.1; }
  .codebox .sub { font-size: 12px; color: var(--muted); }
  .primary { height: 40px; padding: 0 16px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .primary:hover { filter: brightness(0.95); }
  iframe { flex: 1; width: 100%; min-height: 55vh; border: 0; background: #fff; }
  pre.text { margin: 0; padding: 20px 24px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.7; }
  .atts { padding: 14px 24px; border-top: 1px solid var(--line-soft); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .atts span { color: var(--muted); }
  .atts a { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--fg); background: var(--chip); }
  .atts a em { font-style: normal; color: var(--muted); }

  footer { max-width: 1200px; margin: 0 auto; padding: 0 24px 24px; display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: var(--muted); }
  footer svg { flex: 0 0 auto; margin-top: 2px; }
  .hidden { display: none !important; }

  @media (max-width: 800px) {
    .bar { padding: 12px 16px; gap: 12px; }
    .brand { font-size: 17px; }
    .brand .mark { width: 28px; height: 28px; }
    .right { gap: 10px; }
    .addr { order: 10; flex-basis: 100%; }
    .pill { height: 32px; font-size: 13px; }
    main { padding: 12px; padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .list, .detail { min-width: 0; }
    main.detail-open .list { display: none; }
    main:not(.detail-open) .detail { display: none; }
    .list { background: transparent; border: 0; border-radius: 0; overflow: visible; }
    .list-head { padding: 2px 6px 8px; border: 0; }
    .items { max-height: none; overflow: visible; display: flex; flex-direction: column; gap: 10px; }
    .items li { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
    .items li.active { background: var(--card); }
    .avatar { flex-basis: 40px; width: 40px; height: 40px; font-size: 15px; }
    .chip-code { font-size: 15px; letter-spacing: 0.1em; padding: 3px 10px; border-radius: 8px; background: var(--accent-soft); }
    .empty { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
    .back { display: inline-flex; min-height: 32px; }
    .detail { min-height: 0; }
    .detail-head { padding: 14px 16px; }
    .detail-head h2 { font-size: 18px; }
    .codebox { margin: 12px 12px 0; flex-direction: column; align-items: stretch; text-align: center; padding: 18px 16px; border-radius: 14px; }
    .codebox .col { min-width: 0; }
    .codebox .code { font-size: 40px; letter-spacing: 0.2em; padding: 4px 0; }
    .primary { height: 48px; justify-content: center; font-size: 15px; border-radius: 10px; }
    iframe { min-height: 0; height: calc(100dvh - 300px); min-height: 320px; }
    pre.text { padding: 16px; }
    .atts { padding: 12px 16px; }
    footer { padding: 4px 18px 24px; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></span>
      {{title}}
    </div>
    <div class="addr">
      <span class="mono" id="mailbox">…</span>
      <button type="button" class="pill" id="copy"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg><span id="copy-label">{{copyAddress}}</span></button>
    </div>
    <div class="right">
      <span class="badge" id="window">{{windowAll}}</span>
      <button type="button" class="icon-btn" id="refresh" aria-label="{{refresh}}" title="{{refresh}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg></button>
    </div>
  </div>
</header>

<div id="denied" class="hidden" style="max-width: 1200px; margin: 0 auto; padding: 24px"><div class="card empty">{{denied}}</div></div>

<main id="layout">
  <section class="card list" aria-label="{{inbox}}">
    <div class="list-head"><b>{{inbox}}</b><span id="count">{{loading}}</span></div>
    <ul class="items" id="items"></ul>
    <div class="empty hidden" id="empty">{{empty}}</div>
    <div class="empty" id="loading">{{loading}}</div>
  </section>

  <section class="card detail" aria-live="polite">
    <div class="detail-head">
      <button type="button" class="back" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>{{back}}</button>
      <div id="detail-meta" class="hidden">
        <h2 id="d-subject"></h2>
        <div class="meta" style="margin-top: 10px">
          <span class="who"><span class="avatar" id="d-avatar" aria-hidden="true"></span><b id="d-name"></b><span class="mono" id="d-addr" style="font-size: 12px; color: var(--muted)"></span></span>
          <span class="dot" aria-hidden="true">·</span>
          <span>{{to}} <span class="mono" id="d-to" style="font-size: 12px"></span></span>
          <span class="dot" aria-hidden="true">·</span>
          <span id="d-time"></span>
        </div>
      </div>
    </div>
    <div id="placeholder" class="placeholder">{{pick}}</div>
    <div class="codebox hidden" id="codebox">
      <div class="col">
        <span class="label">{{codeDetected}}</span>
        <span class="code mono" id="d-code"></span>
        <span class="sub" id="d-code-sub"></span>
      </div>
      <button type="button" class="primary" id="copy-code"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg><span id="copy-code-label">{{copyCode}}</span></button>
    </div>
    <iframe id="frame" class="hidden" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" title="{{title}}"></iframe>
    <pre class="text hidden" id="text"></pre>
    <div class="atts hidden" id="atts"></div>
  </section>
</main>

<footer>
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
  <span>{{footer}}</span>
</footer>

<script>window.__I18N__ = @@I18N_JSON@@; window.__LOCALE__ = "@@LOCALE@@";</script>
<script>
(function () {
  var T = window.__I18N__;
  var LOCALE = window.__LOCALE__ === 'en' ? 'en-US' : 'zh-CN';
  var key = location.pathname.split('/').pop();
  var api = '/api/s/' + encodeURIComponent(key);
  var $ = function (id) { return document.getElementById(id); };
  var current = null;
  var currentCode = null;

  function fmt(tpl, vars) { return tpl.replace(/\{(\w+)\}/g, function (_, k) { return vars[k] != null ? vars[k] : ''; }); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function windowLabel(m) {
    if (!m) return T.windowAll;
    if (m < 60) return fmt(T.windowMin, { n: m });
    if (m < 1440) return fmt(T.windowHour, { n: m / 60 });
    return fmt(T.windowDay, { n: m / 1440 });
  }
  function hm(d) { return d.toLocaleTimeString(LOCALE, { hour12: false, hour: '2-digit', minute: '2-digit' }); }
  function fmtFull(ms) { return ms ? new Date(ms).toLocaleString(LOCALE, { hour12: false, year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''; }
  // 列表与验证码卡片用相对/短时间：1 小时内“N 分钟前”，今天只显示时分，昨天带“昨天”，再早显示日期
  function fmtRelative(ms) {
    if (!ms) return '';
    var d = new Date(ms), now = new Date();
    var diffMin = Math.round((now - d) / 60000);
    if (diffMin < 1) return T.justNow;
    if (diffMin < 60) return fmt(T.minAgo, { n: diffMin });
    if (d.toDateString() === now.toDateString()) return hm(d);
    var y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return T.yesterday + ' ' + hm(d);
    var opts = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
    if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
    return d.toLocaleString(LOCALE, opts);
  }
  function senderName(f) { return (f && (f.name || f.address)) || T.unknownSender; }
  function initial(f) {
    var s = (f && (f.name || f.address) || '?').trim();
    var ch = s.charAt(0).toUpperCase();
    return /[A-Za-z0-9一-鿿]/.test(ch) ? ch : '?';
  }

  // 邮件 HTML 消毒：去脚本/表单/外链资源，只保留 http(s)/mailto 链接；再放进 sandbox iframe + 严格 CSP
  function sanitize(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script, iframe, frame, object, embed, form, link, meta, base, applet, noscript').forEach(function (n) { n.remove(); });
    doc.querySelectorAll('*').forEach(function (el) {
      Array.prototype.slice.call(el.attributes).forEach(function (a) {
        var name = a.name.toLowerCase(), v = a.value.trim();
        if (name.indexOf('on') === 0 || name === 'srcdoc' || name === 'formaction') { el.removeAttribute(a.name); return; }
        if (name === 'href') {
          if (!/^(https?:|mailto:)/i.test(v)) { el.removeAttribute('href'); return; }
          el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener noreferrer');
        }
        if (name === 'src' && !/^data:image\//i.test(v)) { if (el.tagName === 'IMG') { el.remove(); return; } el.removeAttribute('src'); }
        if (name === 'style' && /url\s*\(/i.test(v) && !/url\s*\(\s*['"]?data:image\//i.test(v)) el.removeAttribute('style');
      });
    });
    return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
      + '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src data:; style-src \'unsafe-inline\'; font-src data:; base-uri \'none\'; form-action \'none\'">'
      + '<style>html,body{margin:0;background:#fff;color:#16181D}body{box-sizing:border-box;padding:20px 24px;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif;overflow-wrap:anywhere}img,table{max-width:100%}img{height:auto}pre{white-space:pre-wrap}a{color:#2F5BEA}</style>'
      + '</head><body>' + doc.body.innerHTML + '</body></html>';
  }

  var mobile = window.matchMedia('(max-width: 800px)');
  var detailPushed = false;
  function openDetailPane() {
    $('layout').classList.add('detail-open');
    if (mobile.matches) {
      window.scrollTo(0, 0);
      // 手机上把详情记成一条历史，系统返回手势/返回键回到列表而不是离开页面
      if (!detailPushed) { history.pushState({ detail: true }, ''); detailPushed = true; }
    }
  }
  function closeDetailPane() { detailPushed = false; $('layout').classList.remove('detail-open'); }

  // 正文 iframe 每次都重新创建：已有 iframe 再次导航会往浏览器历史里加记录，
  // 导致“返回”先回退 iframe 而不是回到列表（正文也会因此变空）
  function mountFrame(doc) {
    var old = $('frame');
    var f = document.createElement('iframe');
    f.id = 'frame';
    f.setAttribute('sandbox', 'allow-popups allow-popups-to-escape-sandbox');
    f.setAttribute('referrerpolicy', 'no-referrer');
    f.title = old.title;
    f.srcdoc = doc;
    old.parentNode.replaceChild(f, old);
  }

  function showDenied() {
    $('denied').classList.remove('hidden');
    $('layout').classList.add('hidden');
    $('mailbox').textContent = '—';
  }

  function render(data) {
    $('mailbox').textContent = data.mailbox;
    $('window').textContent = windowLabel(data.windowMinutes);
    document.title = (data.label ? data.label + ' · ' : '') + T.title;
    $('count').textContent = fmt(T.countFmt, { n: data.items.length }) + ' · ' + T.autoRefresh;
    $('loading').classList.add('hidden');
    $('empty').classList.toggle('hidden', data.items.length > 0);
    var ul = $('items'); ul.innerHTML = '';
    data.items.forEach(function (m) {
      var li = document.createElement('li');
      li.dataset.id = m.id;
      if (current === m.id) li.classList.add('active');
      var third = m.code
        ? '<div class="coderow"><span class="chip-code mono">' + esc(m.code) + '</span><span class="snippet">' + esc(m.snippet || '') + '</span></div>'
        : '<div class="snippet">' + esc(m.snippet || '') + '</div>';
      li.innerHTML = '<div class="avatar' + (m.code ? ' code' : '') + '" aria-hidden="true">' + esc(initial(m.from)) + '</div>'
        + '<div class="body"><div class="row1"><span class="from">' + esc(senderName(m.from)) + '</span><span class="time" title="' + esc(fmtFull(m.receivedAt)) + '">' + esc(fmtRelative(m.receivedAt)) + '</span></div>'
        + '<div class="subject">' + esc(m.subject || T.noSubject) + (m.attachmentCount ? ' 📎' : '') + '</div>' + third + '</div>';
      li.addEventListener('click', function () { open(m.id); });
      ul.appendChild(li);
    });
  }

  function load() {
    fetch(api + '/messages', { cache: 'no-store' }).then(function (r) {
      if (r.status === 403) { showDenied(); return null; }
      return r.json();
    }).then(function (d) { if (d) render(d); }).catch(function () { $('loading').textContent = T.loadFailed; });
  }

  function open(id) {
    current = id; currentCode = null;
    document.querySelectorAll('#items li').forEach(function (li) { li.classList.toggle('active', li.dataset.id === id); });
    openDetailPane();
    $('placeholder').textContent = T.loadingMsg;
    $('placeholder').classList.remove('hidden');
    ['detail-meta', 'codebox', 'frame', 'text', 'atts'].forEach(function (i) { $(i).classList.add('hidden'); });
    fetch(api + '/messages/' + encodeURIComponent(id), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(String(r.status));
      return r.json();
    }).then(function (m) {
      if (current !== id) return;
      $('placeholder').classList.add('hidden');
      $('detail-meta').classList.remove('hidden');
      $('d-subject').textContent = m.subject || T.noSubject;
      $('d-avatar').textContent = initial(m.from);
      $('d-avatar').classList.toggle('code', !!m.code);
      $('d-name').textContent = (m.from && m.from.name) || (m.from && m.from.address) || T.unknownSender;
      $('d-addr').textContent = (m.from && m.from.name && m.from.address) ? m.from.address : '';
      $('d-to').textContent = m.mailbox;
      $('d-time').textContent = fmtFull(m.receivedAt);
      if (m.code) {
        currentCode = m.code;
        $('d-code').textContent = m.code;
        $('d-code-sub').textContent = fmt(T.receivedAgo, { t: fmtRelative(m.receivedAt) });
        $('copy-code-label').textContent = T.copyCode;
        $('codebox').classList.remove('hidden');
      }
      if (m.html) {
        mountFrame(sanitize(m.html));
      } else {
        $('text').textContent = m.text || T.emptyBody;
        $('text').classList.remove('hidden');
      }
      if (m.attachments && m.attachments.length) {
        $('atts').innerHTML = '<span>' + esc(T.attachments) + '</span>' + m.attachments.map(function (a) {
          return '<a href="' + esc(a.url) + '" download><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>'
            + esc(a.filename) + ' <em>· ' + Math.max(1, Math.round(a.size / 1024)) + ' KB</em></a>';
        }).join('');
        $('atts').classList.remove('hidden');
      }
    }).catch(function () { $('placeholder').textContent = T.gone; });
  }

  function copyText(text, labelId, doneText, idleText) {
    if (!navigator.clipboard || !text) return;
    navigator.clipboard.writeText(text).then(function () {
      $(labelId).textContent = doneText;
      setTimeout(function () { $(labelId).textContent = idleText; }, 1500);
    });
  }

  $('back').addEventListener('click', function () {
    if (detailPushed) { detailPushed = false; history.back(); } else closeDetailPane();
  });
  window.addEventListener('popstate', closeDetailPane);
  $('refresh').addEventListener('click', load);
  $('copy').addEventListener('click', function () {
    var t = $('mailbox').textContent;
    if (t && t !== '—') copyText(t, 'copy-label', T.copied, T.copyAddress);
  });
  $('copy-code').addEventListener('click', function () { copyText(currentCode, 'copy-code-label', T.codeCopied, T.copyCode); });
  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
