# fork 即部署：在你的仓库里设置
#   Settings → Secrets and variables → Actions
#     Variables: DEPLOY_WITH_ACTIONS = true
#     Secrets:   CLOUDFLARE_API_TOKEN（权限：Workers Scripts、D1、R2、Email Routing 均需 Edit）
#                CLOUDFLARE_ACCOUNT_ID
#                ADMIN_TOKEN（管理页令牌，≥16 位随机串）
# 没设 DEPLOY_WITH_ACTIONS 时本工作流直接跳过，不会和 Workers Builds 冲突。
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.DEPLOY_WITH_ACTIONS == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations and deploy
        run: pnpm run deploy
      - name: Set ADMIN_TOKEN secret
        if: ${{ secrets.ADMIN_TOKEN != '' }}
        run: printf '%s' "${{ secrets.ADMIN_TOKEN }}" | pnpm wrangler secret put ADMIN_TOKEN
