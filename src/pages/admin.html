<!doctype html>
<html lang="@@LOCALE@@">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{adminTitle}}</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f6f8; --card:#fff; --fg:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#059669; --danger:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1419; --card:#171d26; --fg:#e5e7eb; --muted:#9ca3af; --line:#2a3340; --accent:#34d399; --danger:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans SC",sans-serif; -webkit-text-size-adjust:100%; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 16px; padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); }
  h1 { font-size: 20px; margin: 0 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  /* 16px 起步：iOS 聚焦小于 16px 的输入框会自动放大页面 */
  input, select { font:inherit; font-size:16px; width:100%; min-height:40px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:10px; align-items:end; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:7px 14px; min-height:38px; -webkit-tap-highlight-color:transparent; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size:13px; }
  .muted { color:var(--muted); font-size:13px; }
  .err { color:var(--danger); font-size:13px; margin-top:8px; }
  .hidden { display:none !important; }
  .tag { font-size:12px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); }
  .tag.active { color:var(--accent); border-color:var(--accent); }
  .tag.warn { color:var(--danger); border-color:var(--danger); margin-left:6px; }
  td.actions { white-space:nowrap; }
  label.check { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:14px; color:var(--fg); cursor:pointer; }
  label.check input { width:18px; height:18px; min-height:0; margin:0; }
  @media (max-width: 700px) {
    /* 窄屏：表格改成一行一张卡片，每个单元格前面带列名 */
    .grid { grid-template-columns: 1fr; }
    table, tbody, tr, td { display:block; width:100%; }
    thead { display:none; }
    tr { border:1px solid var(--line); border-radius:10px; padding:6px 10px; margin-bottom:10px; }
    td { display:flex; gap:10px; border:0; padding:5px 0; }
    td::before { content:attr(data-label); flex:0 0 6em; color:var(--muted); font-size:13px; }
    td.actions::before { content:none; }
    td.actions { gap:8px; padding-top:8px; white-space:normal; }
    td.actions button { flex:1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>{{adminTitle}}</h1>

  <div class="card" id="auth">
    <label for="token">{{tokenLabel}}</label>
    <div class="grid"><input id="token" type="password" autocomplete="off"><button class="primary" id="login">{{enter}}</button></div>
    <div class="err hidden" id="auth-err">{{authErr}}</div>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <h2 style="font-size:16px;margin:0 0 10px">{{newLink}}</h2>
      <div class="grid">
        <div><label for="mailbox">{{mailbox}}</label><input id="mailbox" list="mailboxes" placeholder="{{mailboxPlaceholder}}"><datalist id="mailboxes"></datalist></div>
        <div><label for="window">{{window}}</label>
          <select id="window">
            <option value="30">{{win30}}</option><option value="60">{{win60}}</option><option value="360">{{win360}}</option>
            <option value="1440">{{win1440}}</option><option value="10080">{{win10080}}</option><option value="0">{{win0}}</option>
          </select></div>
        <div><label for="expires">{{expires}}</label><input id="expires" type="datetime-local"></div>
        <div><label for="label">{{label}}</label><input id="label" placeholder="{{labelPlaceholder}}"></div>
        <div><button class="primary" id="create">{{create}}</button></div>
      </div>
      <label class="check" for="sensitive"><input type="checkbox" id="sensitive"> <span>{{showSensitive}}</span></label>
      <div class="muted" style="margin-top:2px">{{showSensitiveHint}}</div>
      <div class="err hidden" id="create-err"></div>
      <div class="muted" id="created" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h2 style="font-size:16px;margin:0 0 10px">{{mailboxes}}</h2>
      <table><thead><tr><th>{{thMailbox}}</th><th>{{thCount}}</th><th>{{thLatest}}</th></tr></thead><tbody id="mb-rows"></tbody></table>
      <div class="muted" id="mb-empty">{{mbEmpty}}</div>
    </div>

    <div class="card">
      <h2 style="font-size:16px;margin:0 0 10px">{{links}}</h2>
      <table><thead><tr><th>{{thLink}}</th><th>{{thMailbox}}</th><th>{{thWindow}}</th><th>{{thStatus}}</th><th>{{thExpires}}</th><th></th></tr></thead><tbody id="link-rows"></tbody></table>
      <div class="muted hidden" id="link-empty">{{linkEmpty}}</div>
    </div>
  </div>
</div>

<script>window.__I18N__ = @@I18N_JSON@@; window.__LOCALE__ = "@@LOCALE@@";</script>
<script>
(function () {
  var T = window.__I18N__;
  var LOCALE = window.__LOCALE__ === 'en' ? 'en-US' : 'zh-CN';
  var $ = function (id) { return document.getElementById(id); };
  var token = sessionStorage.getItem('shared-inbox-admin-token') || '';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function tpl(s, vars) { return s.replace(/\{(\w+)\}/g, function (_, k) { return vars[k] != null ? vars[k] : ''; }); }
  function fmt(ms) { return ms ? new Date(ms).toLocaleString(LOCALE, { hour12: false, year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—'; }
  function win(m) { return !m ? T.winAll : m < 60 ? tpl(T.winMin, { n: m }) : m < 1440 ? tpl(T.winHour, { n: m / 60 }) : tpl(T.winDay, { n: m / 1440 }); }
  function statusLabel(s) { return s === 'active' ? T.statusActive : s === 'revoked' ? T.statusRevoked : s === 'expired' ? T.statusExpired : s; }
  function errorLabel(code) {
    return { invalid_mailbox: T.errInvalidMailbox, invalid_window: T.errInvalidWindow, invalid_expires_at: T.errInvalidExpires, expires_in_past: T.errExpiresPast }[code] || code;
  }
  function req(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }, opts.headers || {});
    return fetch(path, opts).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; }); });
  }

  function enter() {
    token = $('token').value.trim();
    req('/api/admin/session').then(function (r) {
      if (!r.ok) { $('auth-err').classList.remove('hidden'); return; }
      sessionStorage.setItem('shared-inbox-admin-token', token);
      $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
      refresh();
    });
  }

  function refresh() {
    req('/api/admin/mailboxes').then(function (r) {
      var rows = r.body.items || [];
      $('mb-rows').innerHTML = rows.map(function (m) {
        return '<tr><td data-label="' + esc(T.thMailbox) + '"><code>' + esc(m.mailbox) + '</code></td><td data-label="' + esc(T.thCount) + '">' + m.count + '</td><td data-label="' + esc(T.thLatest) + '">' + esc(fmt(m.latest)) + '</td></tr>';
      }).join('');
      $('mb-empty').classList.toggle('hidden', rows.length > 0);
      $('mailboxes').innerHTML = rows.map(function (m) { return '<option value="' + esc(m.mailbox) + '">'; }).join('');
    });
    req('/api/admin/links').then(function (r) {
      var rows = r.body.items || [];
      $('link-empty').classList.toggle('hidden', rows.length > 0);
      $('link-rows').innerHTML = rows.map(function (l) {
        return '<tr><td data-label="' + esc(T.thLink) + '"><div><a href="' + esc(l.url) + '" target="_blank" rel="noopener"><code>/s/' + esc(l.key.slice(0, 8)) + '…</code></a>'
          + (l.label ? '<div class="muted">' + esc(l.label) + '</div>' : '') + '</div></td>'
          + '<td data-label="' + esc(T.thMailbox) + '"><code>' + esc(l.mailbox) + '</code></td><td data-label="' + esc(T.thWindow) + '">' + esc(win(l.window_minutes)) + (l.show_sensitive ? ' <span class="tag warn">' + esc(T.tagSensitive) + '</span>' : '') + '</td>'
          + '<td data-label="' + esc(T.thStatus) + '"><span class="tag ' + esc(l.status) + '">' + esc(statusLabel(l.status)) + '</span></td><td data-label="' + esc(T.thExpires) + '">' + esc(fmt(l.expires_at)) + '</td>'
          + '<td class="actions">' + (l.status === 'active' ? '<button class="danger" data-revoke="' + esc(l.key) + '">' + esc(T.revoke) + '</button> <button data-copy="' + esc(l.url) + '">' + esc(T.copy) + '</button>' : '') + '</td></tr>';
      }).join('');
    });
  }

  $('login').addEventListener('click', enter);
  $('token').addEventListener('keydown', function (e) { if (e.key === 'Enter') enter(); });

  $('create').addEventListener('click', function () {
    $('create-err').classList.add('hidden');
    var expires = $('expires').value ? new Date($('expires').value).toISOString() : null;
    req('/api/admin/links', { method: 'POST', body: JSON.stringify({ mailbox: $('mailbox').value, windowMinutes: Number($('window').value), expiresAt: expires, label: $('label').value, showSensitive: $('sensitive').checked }) })
      .then(function (r) {
        if (!r.ok) { $('create-err').textContent = tpl(T.createFailed, { reason: errorLabel(r.body.error || r.status) }); $('create-err').classList.remove('hidden'); return; }
        $('created').innerHTML = esc(T.created) + '<a href="' + esc(r.body.link.url) + '" target="_blank" rel="noopener">' + esc(r.body.link.url) + '</a>';
        refresh();
      });
  });

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.revoke) {
      if (!confirm(T.confirmRevoke)) return;
      req('/api/admin/links/' + encodeURIComponent(t.dataset.revoke), { method: 'DELETE' }).then(refresh);
    }
    if (t.dataset && t.dataset.copy && navigator.clipboard) {
      navigator.clipboard.writeText(t.dataset.copy).then(function () { t.textContent = T.copied; setTimeout(function () { t.textContent = T.copy; }, 1500); });
    }
  });

  if (token) { $('token').value = token; enter(); }
})();
</script>
</body>
</html>
